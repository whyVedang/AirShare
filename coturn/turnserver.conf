# ─── AirShare coturn STUN/TURN Server Configuration ───

# STUN+TURN listening port
listening-port=3478

# Your server's public IP address
# IMPORTANT: Replace this with your actual server's public IP before deploying
external-ip=34.136.190.192

# UDP relay port range (open these in your firewall)
min-port=49152
max-port=65535

# Realm (identifier for your TURN deployment)
realm=airshare

# Static credentials
# IMPORTANT: Change the password before deploying
user=airshare:airshare-secret-password

# Use long-term credential mechanism
lt-cred-mech

# Security fingerprinting
fingerprint

# Disable CLI admin interface (not needed)
no-cli

# Logging
verbose
